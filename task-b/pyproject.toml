[project]
name = "agent-assignment-solution"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.128,<0.129",
    "pydantic>=2.13,<3",
    "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.4,<9", "httpx>=0.28,<1"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: requires the local Elasticsearch 9.4.2 instance",
]
